<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рятувальничок — реєстрація</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/onboarding.css') }}">
</head>
<body class="onboarding-body">
  <header class="topbar">
    <div class="brand">Рятуваль<span>ничок</span></div>
    <div class="lang-switch" role="group" aria-label="Язык интерфейса / Мова інтерфейсу">
      <button type="button" class="lang-btn" data-lang="ru">РУС</button>
      <button type="button" class="lang-btn" data-lang="uk">УКР</button>
    </div>
  </header>

  <main class="onboarding-main">
    <div class="onboarding-card">
      <h1 data-i18n="auth.register.title">Регистрация</h1>
      <p class="subtitle" data-i18n="auth.register.subtitle">Создайте аккаунт, чтобы начать работу с Рятувальничком.</p>

      {% if error %}
      <div class="status-box show error">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <div class="field">
          <label for="reg-email" data-i18n="auth.field.email">Email</label>
          <input type="email" id="reg-email" name="email" autocomplete="email" required value="{{ email or '' }}">
        </div>
        <div class="field">
          <label for="reg-password" data-i18n="auth.field.password">Пароль</label>
          <input type="password" id="reg-password" name="password" autocomplete="new-password" required minlength="8">
        </div>
        <div class="field">
          <label for="reg-password2" data-i18n="auth.field.password2">Повторите пароль</label>
          <input type="password" id="reg-password2" name="password2" autocomplete="new-password" required minlength="8">
        </div>
        <div class="ob-actions">
          <button class="btn" type="submit" data-i18n="auth.register.submit_btn">Зарегистрироваться</button>
        </div>
      </form>

      <p class="hint" style="margin-top:16px;">
        <span data-i18n="auth.register.has_account">Уже есть аккаунт?</span>
        <a href="{{ url_for('auth.login') }}" data-i18n="auth.register.login_link">Войти</a>
      </p>
    </div>
  </main>

  <script>window.__I18N__ = {{ i18n | tojson }};</script>
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
</body>
</html>
