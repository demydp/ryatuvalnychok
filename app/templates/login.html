<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рятувальничок — вхід</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/onboarding.css') }}">
</head>
<body class="onboarding-body">
  <header class="topbar">
    <div class="brand">Рятуваль<span>ничок</span></div>
    <div class="lang-switch" role="group" aria-label="Язык интерфейса / Мова інтерфейсу">
      <button type="button" class="lang-btn" data-lang="ru">РУС</button>
      <button type="button" class="lang-btn" data-lang="uk">УКР</button>
    </div>
  </header>

  <main class="onboarding-main">
    <div class="onboarding-card">
      <h1 data-i18n="auth.login.title">Вход</h1>
      <p class="subtitle" data-i18n="auth.login.subtitle">Войдите в свой аккаунт Рятувальничка.</p>

      {% if error %}
      <div class="status-box show error">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <div class="field">
          <label for="login-email" data-i18n="auth.field.email">Email</label>
          <input type="email" id="login-email" name="email" autocomplete="email" required value="{{ email or '' }}">
        </div>
        <div class="field">
          <label for="login-password" data-i18n="auth.field.password">Пароль</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </div>
        <div class="ob-actions">
          <button class="btn" type="submit" data-i18n="auth.login.submit_btn">Войти</button>
        </div>
      </form>

      <p class="hint" style="margin-top:16px;">
        <span data-i18n="auth.login.no_account">Ещё нет аккаунта?</span>
        <a href="{{ url_for('auth.register') }}" data-i18n="auth.login.register_link">Зарегистрироваться</a>
      </p>
    </div>
  </main>

  <script>window.__I18N__ = {{ i18n | tojson }};</script>
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
</body>
</html>
